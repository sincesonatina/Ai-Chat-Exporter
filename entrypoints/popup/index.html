<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Exporter</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <main id="app">
      <section id="unsupported" hidden>
        <p>Open a ChatGPT conversation, then click the extension icon again.</p>
      </section>

      <section id="ready" hidden>
        <h1 id="title">…</h1>
        <p id="count" class="muted"></p>

        <fieldset class="formats">
          <legend>Format</legend>
          <label><input type="radio" name="format" value="txt" /> TXT</label>
          <label><input type="radio" name="format" value="md" /> MD</label>
          <label title="Coming soon"><input type="radio" name="format" value="pdf" disabled /> PDF</label>
        </fieldset>

        <button id="export" type="button">Export</button>
        <p id="status" class="muted" role="status"></p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
